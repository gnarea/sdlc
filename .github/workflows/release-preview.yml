name: Release preview

on:
  pull_request:
    branches: [main]
    # `edited` covers a change to the title or the description, which the squash commit's message takes.
    types: [opened, reopened, synchronize, edited]
  # For the head that the version bump pushes, since its push can't start workflows.
  workflow_dispatch:
    inputs:
      pull-request:
        description: Number of the pull request whose head is the branch's
        required: true
        type: number

permissions: {}

jobs:
  preview:
    # Editing a closed pull request's title or description triggers the workflow too.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.state == 'open'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: release-preview-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: true
    env:
      # Fork and Dependabot pull requests get a read-only token, so CI can't set their version.
      CAN_PUSH: >-
        ${{
          (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch')
          || (
            github.event.pull_request.head.repo.full_name == github.repository
            && github.event.pull_request.user.login != 'dependabot[bot]'
          )
        }}
    outputs:
      version-to-bump: ${{ steps.preview.outputs.version-to-bump }}
      can-push: ${{ env.CAN_PUSH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm

      - name: Install dependencies
        # None of the dependencies that the preview needs has an install script.
        run: npm ci --ignore-scripts

      - name: Preview the release that squashing the pull request would make
        id: preview
        run: node .github/scripts/release/preview-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || inputs.pull-request }}
          CHECKED_OUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Require the plugin's version to be set by hand
        if: steps.preview.outputs.version-to-bump != '' && env.CAN_PUSH != 'true'
        run: |
          echo "::error file=.claude-plugin/plugin.json::Plugin's version must be $VERSION_TO_BUMP, which CI can't set on this pull request's branch"
          exit 1
        env:
          VERSION_TO_BUMP: ${{ steps.preview.outputs.version-to-bump }}

  # Runs none of the npm dependencies, since it's the only job on a pull request that can push.
  bump-version:
    needs: preview
    if: needs.preview.outputs.version-to-bump != '' && needs.preview.outputs.can-push == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    concurrency:
      group: bump-version-${{ github.event.pull_request.number || inputs.pull-request }}
      # Cancelling it between the push and the dispatch would leave the new head without checks.
      cancel-in-progress: false
    env:
      BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Push the bump to the pull request's branch
        run: node .github/scripts/release/bump-plugin-version.mjs
        env:
          VERSION: ${{ needs.preview.outputs.version-to-bump }}

      # The push can't start workflows, since it uses the workflow's token.
      - name: Run the checks on the branch's new head
        run: |
          function dispatch {
            for attempt in 1 2 3; do
              gh workflow run "$@" --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" && return 0
              sleep $((attempt * 10))
            done
            echo "::error::Couldn't run $1 on the branch's new head: re-run this job on its own, which pushes nothing again"
            return 1
          }
          has_failed=false
          dispatch ci.yml || has_failed=true
          dispatch release-preview.yml --field "pull-request=$PULL_REQUEST_NUMBER" || has_failed=true
          [[ "$has_failed" == false ]]
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || inputs.pull-request }}
