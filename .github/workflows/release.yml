name: Release

on:
  push:
    branches: [main]

permissions: {}

# Releases must happen one at a time, in the order of the commits, since each builds on the last one's tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm

      - name: Install dependencies
        # The job can push tags, so none of the dependencies' install scripts may run. semantic-release needs none.
        run: npm ci --ignore-scripts

      - name: Tag the commit and publish its release, if it warrants one
        run: npm exec --no -- semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Require the plugin's version to have been released
        run: node .github/scripts/release/require-released-version.mjs
