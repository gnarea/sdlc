name: Release

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main]

permissions: {}

jobs:
  title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}

  version:
    # Edits to a closed pull request would otherwise push the version to its deleted branch.
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      BASE: ${{ github.base_ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # The job can push, so none of the dependencies' install scripts may run. semantic-release needs none.
        run: npm ci --ignore-scripts

      - name: Set the plugin's version to that of the release that squashing the pull request would make
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Treat the base's version as released, in case its release is still running.
          git tag "v$(git show "origin/$BASE:.claude-plugin/plugin.json" | jq --raw-output .version)" "origin/$BASE" 2>/dev/null || true
          message="$(printf '%s (#%s)\n\n%s' "$TITLE" "$PULL_REQUEST" "$BODY")"
          git switch --quiet --force-create "$BASE" "$(git commit-tree "$HEAD_SHA^{tree}" -p "origin/$BASE" -m "$message")"
          # Undo any version that CI set before the title changed to a type that doesn't release.
          version="$(git show "$(git merge-base "origin/$BASE" "$HEAD_SHA"):.claude-plugin/plugin.json" | jq --raw-output .version)"
          jq --arg version "$version" '.version = $version' .claude-plugin/plugin.json > plugin.json.tmp && mv plugin.json.tmp .claude-plugin/plugin.json
          # Without GitHub Actions' variables, semantic-release takes the branch from git, rather than the pull request's.
          env -u GITHUB_ACTIONS npm exec --no -- semantic-release --dry-run
        env:
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Require a new version for changes to agents or skills
        # Existing users only get a change to what Claude Code loads when the version changes.
        run: |
          base="$(git merge-base "origin/$BASE" "$HEAD_SHA")"
          if git diff --quiet "$base" -- .claude-plugin/plugin.json && ! git diff --quiet "$base" "$HEAD_SHA" -- agents skills; then
            echo "::error::Pull request changes agents or skills, so its type must release a version, such as feat or fix"
            exit 1
          fi

      - name: Push the plugin's version
        run: |
          if git diff --quiet; then
            exit 0
          fi
          version="$(jq --raw-output .version .claude-plugin/plugin.json)"
          git switch --quiet --detach "$HEAD_SHA"
          git commit --quiet --message "chore: Set the plugin's version to $version" .claude-plugin/plugin.json
          if ! git push --quiet origin "HEAD:refs/heads/$BRANCH"; then
            echo "::error file=.claude-plugin/plugin.json::Plugin's version must be $version"
            exit 1
          fi
        env:
          BRANCH: ${{ github.head_ref }}

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # Each release builds on the last one's tag, so they have to happen one at a time, in order.
    concurrency: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # The job can push tags, so none of the dependencies' install scripts may run. semantic-release needs none.
        run: npm ci --ignore-scripts

      - name: Tag the commit and publish its release, if it warrants one
        run: npm exec --no -- semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
