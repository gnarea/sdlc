name: Release

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  dry-run:
    # Edits to a closed pull request would otherwise push the bump to its deleted branch.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.state == 'open'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      actions: write
    env:
      PULL_REQUEST: ${{ github.event.pull_request.number || github.ref_name }}
      BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # The job can push, so none of the dependencies' install scripts may run. semantic-release needs none.
        run: npm ci --ignore-scripts

      - name: Require the pull request's title to follow Conventional Commits
        run: |
          title="$(gh pr view "$PULL_REQUEST" --json title --jq .title)"
          pattern='^[a-z]+(\([a-z0-9-]+\))?!?: [^ ]'
          if [[ ! "$title" =~ $pattern ]]; then
            echo "::error::Pull request's title must follow Conventional Commits (got \"$title\")"
            exit 1
          fi

      - name: Set the plugin's version to that of the release that squashing the pull request would make
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Treat main's version as released, in case its release is still running.
          git tag "v$(git show origin/main:.claude-plugin/plugin.json | jq --raw-output .version)" origin/main 2>/dev/null || true
          message="$(gh pr view "$PULL_REQUEST" --json number,title,body --jq '"\(.title) (#\(.number))\n\n\(.body)"')"
          git switch --quiet --force-create main "$(git commit-tree "$HEAD_SHA^{tree}" -p origin/main -m "$message")"
          # Without GitHub Actions' variables, semantic-release takes the branch from git, rather than the pull request's.
          env -u GITHUB_ACTIONS npm exec --no -- semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Require a new version for changes to agents or skills
        # Existing users only get a change to what Claude Code loads when the version changes.
        run: |
          base="$(git merge-base origin/main "$HEAD_SHA")"
          if git diff --quiet "$base" -- .claude-plugin/plugin.json && ! git diff --quiet "$base" "$HEAD_SHA" -- agents skills; then
            echo "::error::Pull request changes agents or skills, so its type must release a version, such as feat or fix"
            exit 1
          fi

      - name: Push the plugin's version
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git switch --quiet --detach "$HEAD_SHA"
          git commit --quiet --message "chore: Set the plugin's version to $(jq --raw-output .version .claude-plugin/plugin.json)" .claude-plugin/plugin.json
          if ! git push --quiet origin "HEAD:refs/heads/$BRANCH"; then
            echo "::error file=.claude-plugin/plugin.json::Plugin's version must be $(jq --raw-output .version .claude-plugin/plugin.json)"
            exit 1
          fi
          # The push starts no workflows, since it uses the workflow's token.
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run release.yml --ref "$BRANCH"

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # Each release builds on the last one's tag, so they have to happen one at a time, in order.
    concurrency: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # The job can push tags, so none of the dependencies' install scripts may run. semantic-release needs none.
        run: npm ci --ignore-scripts

      - name: Tag the commit and publish its release, if it warrants one
        run: npm exec --no -- semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
