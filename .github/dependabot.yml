version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Pull requests' titles must follow Conventional Commits, and dependency updates don't change the plugin.
    commit-message:
      prefix: chore

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Pull requests' titles must follow Conventional Commits, and dependency updates don't change the plugin.
    commit-message:
      prefix: chore

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Pull requests' titles must follow Conventional Commits, and dependency updates don't change the plugin.
    commit-message:
      prefix: chore
